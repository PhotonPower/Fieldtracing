name: Slow tests

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  slow:
    name: pytest -m slow
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt && pip install -e .
      - run: pytest -q -m slow --durations=10
