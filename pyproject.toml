# Python package fieldtracing: numerical reference implementation for the field tracing paper.
# Development tools are pinned in requirements-dev.txt.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldtracing"
version = "0.1.0"
description = "Numerical reference implementation of field tracing (hybrid field, PFT, SFT, LPIA)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fieldtracing = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Expensive reference computations carry the marker `slow`; run them with `pytest -m slow`.
addopts = "-ra -m 'not slow'"
markers = [
    "slow: expensive reference computation (nightly workflow, pytest -m slow)",
    "rtt: needs the raytatouille package (workflow rtt.yml); skipped if it is not installed",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Greek letters and typographic characters in physics text

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
# SciPy ships no type information; raytatouille is optional (typed when installed).
module = ["scipy", "scipy.*", "raytatouille", "raytatouille.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Exploratory scripts: long print lines and inline lambdas are fine.
"experiments/*" = ["E501", "E731"]
